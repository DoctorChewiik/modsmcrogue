name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve latest Fabric versions for 1.21.1
        run: |
          YARN=$(curl -fsS https://meta.fabricmc.net/v2/versions/yarn/1.21.1 | jq -r '.[0].version')
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          FAPI=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oP '(?<=<version>)[^<]*\+1\.21\.1(?=</version>)' | tail -1)
          echo "yarn=$YARN loader=$LOADER fabric-api=$FAPI"
          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/; s/^loader_version=.*/loader_version=$LOADER/; s/^fabric_version=.*/fabric_version=$FAPI/" gradle.properties
          cat gradle.properties

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: roguetower
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "$JAR" --target "${{ github.sha }}" \
            --title "Roguetower $TAG (${GITHUB_REF_NAME})" \
            --notes "Jar compilé automatiquement. Glisser dans le dossier mods (Fabric Loader + Fabric API, Minecraft 1.21.1)." \
            --prerelease
